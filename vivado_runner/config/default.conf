#!/bin/bash

BG_MAX=12
TIME_LIMIT=10800
# Stop a runaway case from filling a filesystem with repetitive stdout/stderr.
# Set GALAXCORE_MAX_CASE_LOG_MB=0 only when an uncapped run log is required.
MAX_CASE_LOG_MB="${GALAXCORE_MAX_CASE_LOG_MB:-2048}"
export MAX_CASE_LOG_MB
GALAXCORE_BIN="$WORKSPACE_ROOT/../bin/Linux_64/GalaxCore"
REPORT_DST_DIR="$RUNTIME_DIR/exports"
FLOW_CONFIG_ABS=""
