#!/bin/bash

BG_MAX=12
TIME_LIMIT=10800
# Bound the filtered run log while continuing to drain GalaxCore output. The
# case process is not killed when this limit is reached.
# Set GALAXCORE_MAX_CASE_LOG_MB=0 for an uncapped retained log. The known log
# storm is still suppressed unless GALAXCORE_SUPPRESS_PIN_REDEFINITION=0 too.
MAX_CASE_LOG_MB="${GALAXCORE_MAX_CASE_LOG_MB:-2048}"
export MAX_CASE_LOG_MB
# Suppress the known per-pin log storm. A single count is written at case end.
SUPPRESS_PIN_REDEFINITION="${GALAXCORE_SUPPRESS_PIN_REDEFINITION:-1}"
export SUPPRESS_PIN_REDEFINITION
GALAXCORE_BIN="$WORKSPACE_ROOT/../bin/Linux_64/GalaxCore"
# Public export directory (do NOT put this in flow_config).
PUBLIC_DIR_DEFAULT="/home/xiaonan/Share/zw_cache/run_logs"
# Keep the old variable name for compatibility (CLI --report-dst still works).
REPORT_DST_DIR="$RUNTIME_DIR/exports"
FLOW_CONFIG_ABS=""
